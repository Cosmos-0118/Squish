name: release

on:
  push:
    tags:
      # v2.3.4, v2.4.0-rc.1 ... but not an accidental "v" or "vNext".
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

concurrency:
  # Never cancel a release half way through publishing.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET SDK (global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore src/Squish.sln

      - name: Build solution
        run: dotnet build src/Squish.sln --configuration Release --no-restore

      # Tools are staged before the tests, as in ci, so the encoder tests run for real instead of skipping.
      - name: Cache third-party tools
        id: tools-cache
        uses: actions/cache@v6
        with:
          path: tools
          key: tools-${{ runner.os }}-${{ hashFiles('tools/tools-manifest.json', 'scripts/fetch-tools.ps1', 'scripts/ffmpeg-slim/*') }}

      # ffmpeg is compiled, not downloaded. MSYS2 is only set up when the cache above missed (a changed manifest or recipe).
      - name: Prepare the ffmpeg build
        if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/prepare-ffmpeg-build

      - name: Stage third-party tools
        shell: pwsh
        run: ./scripts/fetch-tools.ps1

      - name: Run tests
        env:
          SQUISH_TOOLS_DIR: ${{ github.workspace }}\tools
        run: dotnet test src/Squish.sln --configuration Release --no-build --blame-hang-timeout 10m

      # The same script ci uses, so what is released is what was validated. It stops on any failed publish.
      - name: Publish artifacts and validate layout
        shell: pwsh
        run: ./scripts/publish-layout.ps1 -Output out/publish

      - name: Determine version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare artifact folders
        shell: pwsh
        run: |
          Remove-Item artifacts,portable -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path artifacts | Out-Null
          New-Item -ItemType Directory -Path portable | Out-Null
          Copy-Item "out/publish/*" portable -Recurse -Force

      - name: Create portable zip
        shell: pwsh
        run: |
          $zipName = "Squish-$env:APP_VERSION-win-x64"
          $portableSource = 'portable'
          $targetFolder = Join-Path 'artifacts' $zipName
          if (Test-Path $targetFolder) { Remove-Item $targetFolder -Recurse -Force }
          New-Item -ItemType Directory -Path $targetFolder | Out-Null
          Copy-Item "$portableSource/*" $targetFolder -Recurse -Force
          Compress-Archive -Path (Join-Path $targetFolder '*') -DestinationPath ("$targetFolder.zip") -Force

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe not found' }
          $appVersion = $env:APP_VERSION
          $appOut = Resolve-Path 'out/publish/app'
          $explorerOut = Resolve-Path 'out/publish/explorer'
          & $iscc /Qp `
            "/DMyAppVersion=$appVersion" `
            "/DAppBuildOutput=$appOut" `
            "/DExplorerBuildOutput=$explorerOut" `
            "/DToolsRoot=$(Resolve-Path out/publish/tools)" `
            'installer/SquishInstaller.iss'
          Copy-Item installer/Output/*.exe artifacts -Force

      - name: Write checksums and release notes
        id: notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = @(Get-ChildItem artifacts -File | Where-Object { $_.Extension -in '.exe', '.zip' } | ForEach-Object FullName)
          # Hash the files and write SHA256SUMS.txt. The README block it also rewrites here is a scratch copy:
          # the update-readme job does the real update on the default branch.
          ./scripts/update-release-integrity.ps1 `
            -Version $env:APP_VERSION `
            -Files $files `
            -ChecksumsPath 'artifacts/SHA256SUMS.txt' `
            -Repository '${{ github.repository }}'

          $installer = "Squish-Setup-$($env:APP_VERSION).exe"
          $sha = (Get-FileHash "artifacts/$installer" -Algorithm SHA256).Hash.ToLowerInvariant()
          # Hand-written notes are kept, never replaced. Source, first match wins:
          #   1. .github/release-notes/<tag>.md in the repo (e.g. v2.3.3.md)
          #   2. the body of a release that already exists for this tag (written in the GitHub UI before tagging).
          # The download/checksum block is appended below them between markers, so re-running the workflow
          # replaces only that block and keeps the notes.
          $tag = '${{ github.ref_name }}'
          $custom = ''
          $notesFile = ".github/release-notes/$tag.md"
          if (Test-Path $notesFile) {
            $custom = (Get-Content $notesFile -Raw).Trim()
          } else {
            try {
              $existing = (gh release view $tag --json body --jq .body 2>$null) -join "`n"
              if ($LASTEXITCODE -eq 0 -and $existing) {
                $existing = $existing -replace '(?s)<!-- squish-integrity:start -->.*?<!-- squish-integrity:end -->', ''
                $custom = $existing.Trim()
              }
            } catch { }
          }

          $integrity = @(
            '<!-- squish-integrity:start -->',
            '## Download',
            '',
            "Download **$installer** and run it. Squish is unsigned, so Windows SmartScreen may warn.",
            '',
            'SHA256 of the installer:',
            '',
            '```',
            $sha,
            '```',
            '',
            'Check your download in PowerShell (prints `True` when it matches):',
            '',
            '```powershell',
            "(Get-FileHash .\$installer -Algorithm SHA256).Hash -eq '$sha'",
            '```',
            '',
            'All hashes are in `SHA256SUMS.txt`.',
            '<!-- squish-integrity:end -->'
          ) -join "`n"

          if ($custom) {
            $notes = $custom + "`n`n---`n`n" + $integrity
            "has_custom=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            $notes = $integrity
            "has_custom=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          Set-Content -Path "$env:RUNNER_TEMP/release-notes.md" -Value $notes -Encoding utf8

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: squish-windows-release
          path: artifacts/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Squish ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          # Auto "What's Changed" only when there are no hand-written notes (they carry their own list).
          generate_release_notes: ${{ steps.notes.outputs.has_custom != 'true' }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-readme:
    # Puts the new version, hashes and verify command in the README's "Installer integrity" section through a pull
    # request against the default branch. Pull requests opened with the default GITHUB_TOKEN do not start the ci
    # workflow; add a fine-grained token with contents and pull-requests write access as RELEASE_README_TOKEN to
    # have CI run on them too. "Allow GitHub Actions to create and approve pull requests" must be on.
    needs: build-package
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download release checksums
        uses: actions/download-artifact@v8
        with:
          name: squish-windows-release
          path: release

      - name: Update README
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./scripts/update-release-integrity.ps1 `
            -Version $version `
            -FromChecksums release/SHA256SUMS.txt `
            -Repository '${{ github.repository }}'

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.RELEASE_README_TOKEN || github.token }}
          branch: chore/readme-${{ github.ref_name }}
          delete-branch: true
          add-paths: README.md
          commit-message: "docs: update README for Squish ${{ github.ref_name }}"
          title: "docs: update README checksums for Squish ${{ github.ref_name }}"
          body: |
            Automated by the release workflow after publishing [Squish ${{ github.ref_name }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}).

            Updates the version, SHA256 checksums and verify commands in the README's *Installer integrity* section. Nothing else changes.
