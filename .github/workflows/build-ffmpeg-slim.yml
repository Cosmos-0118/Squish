name: build-ffmpeg-slim

# Builds the FFmpeg that Squish ships: the same shared GPL build as BtbN/FFmpeg-Builds, minus everything Squish never
# runs (see scripts/ffmpeg-slim/apply-slim.sh). The stock builds link whisper.cpp + Vulkan shaders, speech-synthesis
# voices, three extra AV1 encoders, VVC, AVS and a network/disc stack into the DLLs; the slim recipe keeps libx264,
# libx265, libsvtav1, libvpx-vp9, libopus, libwebp, dav1d and the NVENC/AMF/QSV hardware paths.
#
# Manual and rare: run it when bumping FFmpeg or the pinned recipe. It does not publish anything unless "publish" is
# ticked. After publishing, point the "ffmpeg" entry of tools/tools-manifest.json at the release asset and pin the
# SHA256 printed in the job summary (docs/ffmpeg-slim-build.md has the exact entry).

on:
  workflow_dispatch:
    inputs:
      ffmpeg_branch_addin:
        description: "BtbN addin that selects the FFmpeg release branch (addins/<name>.sh, for example 9.0)"
        type: string
        default: "9.0"
      publish:
        description: "Publish the result as a GitHub release"
        type: boolean
        default: false
      release_tag:
        description: "Tag for the release when publishing, for example ffmpeg-slim-9.0.2-r1"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: build-ffmpeg-slim
  cancel-in-progress: false

env:
  # The recipe is pinned: a moving upstream master could rename a build script and change what ships. Bump on purpose.
  BTBN_REPO: https://github.com/BtbN/FFmpeg-Builds.git
  BTBN_COMMIT: c9fe5114060e507409f7ee07edfd82efaf25d767
  DOCKER_BUILDKIT: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      archive: ${{ steps.pack.outputs.archive }}
    steps:
      - name: Checkout Squish
        uses: actions/checkout@v7

      - name: Fetch the pinned build recipe
        run: |
          git clone --filter=blob:none "$BTBN_REPO" ffmpeg-builds
          git -C ffmpeg-builds checkout --detach "$BTBN_COMMIT"

      - name: Apply the slim selection
        run: ./scripts/ffmpeg-slim/apply-slim.sh ffmpeg-builds

      - name: Free disk space
        run: ./ffmpeg-builds/util/free_disk_space.sh

      - name: Cache source downloads
        uses: actions/cache@v6
        with:
          path: ffmpeg-builds/.cache/downloads
          key: ffmpeg-slim-dl-${{ env.BTBN_COMMIT }}-${{ hashFiles('scripts/ffmpeg-slim/apply-slim.sh') }}
          restore-keys: |
            ffmpeg-slim-dl-${{ env.BTBN_COMMIT }}-

      - name: Build the toolchain image and FFmpeg
        working-directory: ffmpeg-builds
        run: |
          ./makeimage.sh win64 slim-shared "${{ inputs.ffmpeg_branch_addin }}"
          ./build.sh win64 slim-shared "${{ inputs.ffmpeg_branch_addin }}"

      - name: Repack as a flat Squish tool archive
        id: pack
        run: |
          set -euo pipefail
          src="$(ls ffmpeg-builds/artifacts/ffmpeg-*-win64-slim-shared-*.zip)"
          name="$(basename "$src" .zip)"
          rm -rf unpack stage && mkdir unpack stage
          unzip -q "$src" -d unpack
          root="unpack/$name"
          # Only what fetch-tools.ps1 stages: the two executables, the shared libraries and the licence.
          cp "$root"/bin/ffmpeg.exe "$root"/bin/ffprobe.exe "$root"/bin/*.dll stage/
          cp "$root"/LICENSE.txt stage/
          cat > stage/SOURCE.txt <<EOF
          This FFmpeg is licensed under the GPL (version 3). It was built by the Squish project from:
            FFmpeg:  ${{ github.server_url }}/FFmpeg/FFmpeg  (release branch selected by addin ${{ inputs.ffmpeg_branch_addin }})
            Recipe:  BtbN/FFmpeg-Builds @ ${BTBN_COMMIT}, with the selection in scripts/ffmpeg-slim/apply-slim.sh of
                     ${{ github.server_url }}/${{ github.repository }} @ ${{ github.sha }}
          Every bundled library (x264, x265, SVT-AV1, libvpx, dav1d, opus, libwebp, ...) is fetched at the commit
          pinned in the recipe's scripts.d/. Rebuild with .github/workflows/build-ffmpeg-slim.yml.
          EOF
          archive="${name}.zip"
          (cd stage && zip -9 -q "../$archive" *)
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          ls -l stage "$archive"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-slim
          path: ${{ steps.pack.outputs.archive }}
          if-no-files-found: error

  verify:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Download
        uses: actions/download-artifact@v8
        with:
          name: ffmpeg-slim
          path: dl

      - name: Check the build does what Squish needs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = (Get-ChildItem dl -Filter *.zip).FullName
          Expand-Archive $zip -DestinationPath ff
          $ffmpeg = Resolve-Path ff/ffmpeg.exe
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $unpacked = (Get-ChildItem ff -File | Measure-Object Length -Sum).Sum
          "archive : $(Split-Path $zip -Leaf)`nsha256  : $sha`nunpacked: {0:N1} MB, zipped {1:N1} MB" -f ($unpacked / 1MB), ((Get-Item $zip).Length / 1MB) |
            Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append | Write-Host

          # Guard against the recipe silently regrowing (the stock build is ~230 MB).
          if ($unpacked -gt 90MB) { throw "Slim build is {0:N1} MB unpacked; expected well under 90 MB." -f ($unpacked / 1MB) }

          $encoders = & $ffmpeg -hide_banner -encoders 2>&1 | Out-String
          $required = 'libx264','libx265','libsvtav1','libvpx-vp9','libopus','libwebp_anim','aac','gif','mov_text',
                      'h264_nvenc','hevc_nvenc','av1_nvenc','h264_amf','hevc_amf','av1_amf','h264_qsv','hevc_qsv','av1_qsv'
          $missing = $required | Where-Object { $encoders -notmatch "\b$([regex]::Escape($_))\b" }
          if ($missing) { throw "Missing encoders: $($missing -join ', ')" }

          $filters = & $ffmpeg -hide_banner -filters 2>&1 | Out-String
          $missing = 'mpdecimate','scale','fps','atempo','loudnorm','palettegen','paletteuse','select','split' |
            Where-Object { $filters -notmatch "\b$_\b" }
          if ($missing) { throw "Missing filters: $($missing -join ', ')" }

          # Software encoders actually encode (hardware ones need a GPU the runner does not have).
          foreach ($enc in 'libx264','libx265','libsvtav1','libvpx-vp9') {
            & $ffmpeg -hide_banner -v error -y -f lavfi -i 'testsrc2=size=320x240:rate=24:duration=1' -c:v $enc "t-$enc.mkv"
            if ($LASTEXITCODE -ne 0 -or (Get-Item "t-$enc.mkv").Length -lt 1000) { throw "$enc failed to encode." }
          }
          & $ffmpeg -hide_banner -v error -y -f lavfi -i 'sine=duration=1' -c:a libopus t-opus.mka
          if ($LASTEXITCODE -ne 0) { throw 'libopus failed to encode.' }
          & $ffmpeg -hide_banner -v error -y -f lavfi -i 'testsrc2=size=160x120:rate=10:duration=1' -c:v libwebp_anim t-anim.webp
          if ($LASTEXITCODE -ne 0) { throw 'libwebp_anim failed to encode.' }

          # ffprobe is what VideoMetadataProbe runs.
          $json = & (Resolve-Path ff/ffprobe.exe) -v error -show_format -show_streams -of json t-libx264.mkv | ConvertFrom-Json
          if ($json.streams[0].codec_name -ne 'h264') { throw 'ffprobe did not report the h264 stream.' }
          "All checks passed." | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

  publish:
    if: ${{ inputs.publish }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download
        uses: actions/download-artifact@v8
        with:
          name: ffmpeg-slim
          path: dl

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [ -n "$TAG" ] || { echo "release_tag is required to publish." >&2; exit 1; }
          zip="$(ls dl/*.zip)"
          sha="$(sha256sum "$zip" | cut -d' ' -f1)"
          cat > notes.md <<EOF
          Slim GPL build of FFmpeg for Squish. Not an official FFmpeg release; the corresponding source and the exact recipe
          are described in SOURCE.txt inside the archive.

          SHA256 of $(basename "$zip"):

          \`\`\`
          $sha
          \`\`\`
          EOF
          gh release create "$TAG" "$zip" --repo "$GITHUB_REPOSITORY" --title "FFmpeg (slim) $TAG" --notes-file notes.md
